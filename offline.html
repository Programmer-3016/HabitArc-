<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="HabitArc" />
    <meta name="theme-color" content="#141212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HabitArc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>You're offline · HabitArc</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #141212;
        color: #f4f2ea;
      }

      body {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100svh;
        padding: 24px;
      }

      main {
        background: #1c1922;
        border: 2px solid #ffffff;
        box-shadow: 6px 6px 0 #7c3aed;
        max-width: 410px;
        padding: 28px 24px;
        text-align: center;
        width: 100%;
      }

      img {
        height: 76px;
        object-fit: contain;
        width: 76px;
      }

      .kicker {
        color: #a78bfa;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 18px 0 8px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        letter-spacing: -0.03em;
        line-height: 1.08;
        margin: 0;
      }

      .desc {
        color: #b8b3c2;
        font-size: 0.96rem;
        line-height: 1.55;
        margin: 14px 0 24px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      button,
      a.btn-secondary {
        align-items: center;
        border: 2px solid #ffffff;
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        text-decoration: none;
      }

      button {
        background: #7c3aed;
        box-shadow: 3px 3px 0 #ffffff;
        color: #ffffff;
      }

      a.btn-secondary {
        background: #24202b;
        color: #f4f2ea;
      }

      button:focus-visible,
      a.btn-secondary:focus-visible {
        outline: 3px solid #10b981;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="HabitArc" />
      <p class="kicker">OFFLINE FALLBACK</p>
      <h1>Page not cached yet</h1>
      <p class="desc">Your habits remain saved on this device. Open your Dashboard offline or reconnect to refresh synced data.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a class="btn-secondary" href="/Dashboard.html">Open Dashboard</a>
      </div>
    </main>
  </body>
</html>

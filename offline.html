<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="HabitArc" />
    <meta name="theme-color" content="#012d1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HabitArc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>You're offline · HabitArc</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f9fa;
        color: #17201c;
      }

      body {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100svh;
        padding: 24px;
      }

      main {
        max-width: 400px;
        text-align: center;
      }

      img {
        height: 76px;
        object-fit: contain;
        width: 76px;
      }

      p:first-of-type {
        color: #0a6042;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 22px 0 10px;
      }

      h1 {
        font-size: clamp(2rem, 8vw, 2.75rem);
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 0;
      }

      p:last-of-type {
        color: #5f6862;
        font-size: 1rem;
        line-height: 1.55;
        margin: 16px 0 28px;
      }

      button {
        background: #013b28;
        border: 0;
        border-radius: 999px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 48px;
        padding: 0 22px;
      }

      button:focus-visible {
        outline: 3px solid #56d9a3;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="HabitArc" />
      <p>CONNECTION NEEDED</p>
      <h1>You're offline</h1>
      <p>Your saved data has not been cleared. Reconnect to load HabitArc and sync your latest progress.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>

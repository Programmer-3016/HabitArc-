<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>HabitArc - AI-Powered Smart Habit Tracking</title>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Wait for Firebase to restore the user's session before routing.
            // This prevents a signed-in user from briefly seeing onboarding.
            const user = await HabitArc.whenAuthReady();
            window.location.replace(user ? 'Dashboard.html' : 'Onboarding.html');
        });
    </script>
</head>
<body>
    <p>Loading HabitArc...</p>
</body>
</html>

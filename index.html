<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="HabitArc" />
    <meta name="theme-color" content="#012d1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HabitArc" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="logo.png" />
    <script defer src="pwa-register.js"></script>
    <title>HabitArc - AI-Powered Smart Habit Tracking</title>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Wait for Firebase to restore the user's session before routing.
            // This prevents a signed-in user from briefly seeing onboarding.
            const user = await HabitArc.whenAuthReady();
            window.location.replace(user ? 'Dashboard.html' : 'Onboarding.html');
        });
    </script>
</head>
<body>
    <p>Loading HabitArc...</p>
</body>
</html>

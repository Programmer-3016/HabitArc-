<script>
(function() {
    let selectedIcon = 'self_improvement';
    let selectedCategory = 'Health';

    // Icon buttons click
    document.querySelectorAll('.icon-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.icon-btn').forEach(b => {
                b.className = 'icon-btn w-12 h-12 rounded-lg bg-surface hover:bg-surface-container border border-outline-variant text-on-surface-variant flex items-center justify-center transition-colors active:scale-95';
            });
            this.className = 'icon-btn w-12 h-12 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center transition-transform active:scale-95';
            selectedIcon = this.dataset.icon;
        });
    });

    // Category buttons click
    document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', function() {
            document.querySelectorAll('.cat-pill').forEach(p => {
                p.className = 'cat-pill px-4 py-2 rounded-full bg-surface border border-outline-variant font-label-md text-label-md text-on-surface-variant cursor-pointer hover:bg-surface-container transition-colors';
            });
            this.className = 'cat-pill px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md cursor-pointer border border-transparent';
            selectedCategory = this.dataset.cat;
        });
    });

    // Form submit
    document.getElementById('add-habit-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('habit-name-input').value.trim();
        if (!name) return;

        const repeatVal = document.getElementById('repeat-select').value;
        let repeatDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        if (repeatVal === 'weekdays') repeatDays = ['mon', 'tue', 'wed', 'thu', 'fri'];
        if (repeatVal === 'weekends') repeatDays = ['sat', 'sun'];

        const reminder = document.getElementById('reminder-time-input').value;
        const why = document.getElementById('why-input').value.trim();
        const motivation = document.getElementById('motivation-input').value.trim();

        const result = HabitArc.addHabit({
            name,
            icon: selectedIcon,
            category: selectedCategory,
            reminder,
            repeat: repeatDays,
            why,
            motivation
        });

        if (result.success) {
            window.location.href = 'Habits.html';
        } else {
            alert(result.message);
        }
    });
})();
</script>

<script>
(async function() {
    let selectedIcon = 'self_improvement';
    let selectedCategory = 'Focus';
    let selectedAccentColor = '';
    const editHabitId = new URLSearchParams(window.location.search).get('edit');
    const form = document.getElementById('add-habit-form');
    const description = document.getElementById('habit-form-description');
    let editingHabit = editHabitId ? HabitArc.getHabitById(editHabitId) : null;

    if (editHabitId && !editingHabit) {
        form.inert = true;
        form.setAttribute('aria-busy', 'true');
        description.setAttribute('role', 'status');
        description.textContent = 'Loading your saved habit…';
        editingHabit = await new Promise((resolve) => {
            let timeout;
            function finish(habit) {
                window.clearTimeout(timeout);
                window.removeEventListener('habitarc:data-changed', check);
                window.removeEventListener('habitarc:cloud-sync-error', failed);
                resolve(habit);
            }
            function check(event) {
                const habit = HabitArc.getHabitById(editHabitId);
                if (habit || event?.detail?.source === 'cloud' || HabitArc.getCloudSyncStatus().connected) {
                    finish(habit);
                }
            }
            function failed() { finish(null); }
            window.addEventListener('habitarc:data-changed', check);
            window.addEventListener('habitarc:cloud-sync-error', failed);
            timeout = window.setTimeout(failed, 12000);
            check();
        });
        form.removeAttribute('aria-busy');
        if (!editingHabit) {
            form.hidden = true;
            description.textContent = 'This habit could not be loaded. Check your connection and reload, or return to Habits.';
            description.setAttribute('role', 'alert');
            return;
        }
        form.inert = false;
    }

    // Older habits can use icons or categories that are not in the default
    // picker. Keep those values visible and selectable when editing.
    if (editingHabit?.icon && !Array.from(document.querySelectorAll('.icon-btn')).some((button) => button.dataset.icon === editingHabit.icon)) {
        const first = document.querySelector('.icon-btn');
        const button = first.cloneNode(true);
        button.dataset.icon = editingHabit.icon;
        button.setAttribute('aria-label', 'Keep existing habit icon');
        button.querySelector('span').textContent = editingHabit.icon;
        first.parentElement.appendChild(button);
    }
    if (editingHabit?.category && !Array.from(document.querySelectorAll('.cat-pill')).some((button) => button.dataset.cat === editingHabit.category)) {
        const first = document.querySelector('.cat-pill');
        const button = first.cloneNode(true);
        button.dataset.cat = editingHabit.category;
        button.textContent = editingHabit.category;
        first.parentElement.appendChild(button);
    }

    function setSelectedIcon(icon) {
        selectedIcon = icon;
        document.querySelectorAll('.icon-btn').forEach((button) => {
            const isSelected = button.dataset.icon === icon;
            button.className = isSelected
                ? 'icon-btn w-12 h-12 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center transition-transform active:scale-95'
                : 'icon-btn w-12 h-12 rounded-lg bg-surface hover:bg-surface-container border border-outline-variant text-on-surface-variant flex items-center justify-center transition-colors active:scale-95';
            button.setAttribute('aria-pressed', String(isSelected));
        });
    }

    function setSelectedCategory(category) {
        selectedCategory = category;
        document.querySelectorAll('.cat-pill').forEach((pill) => {
            const isSelected = pill.dataset.cat === category;
            pill.className = isSelected
                ? 'cat-pill px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md cursor-pointer border border-transparent'
                : 'cat-pill px-4 py-2 rounded-full bg-surface border border-outline-variant font-label-md text-label-md text-on-surface-variant cursor-pointer hover:bg-surface-container transition-colors';
            pill.setAttribute('aria-pressed', String(isSelected));
        });
    }

    function setSelectedAccentColor(color) {
        selectedAccentColor = color || '';
        document.querySelectorAll('.accent-color-btn').forEach((button) => {
            const isSelected = button.dataset.accent === selectedAccentColor;
            button.classList.toggle('ring-2', isSelected);
            button.classList.toggle('ring-primary', isSelected);
            button.setAttribute('aria-pressed', String(isSelected));
        });
    }

    // Icon buttons click
    document.querySelectorAll('.icon-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            setSelectedIcon(this.dataset.icon);
        });
    });

    // Category buttons click
    document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', function() {
            setSelectedCategory(this.dataset.cat);
        });
    });

    document.querySelectorAll('.accent-color-btn').forEach((button) => {
        button.addEventListener('click', function() {
            setSelectedAccentColor(this.dataset.accent);
        });
    });

    function repeatValueFromDays(repeat) {
        if (!Array.isArray(repeat)) return 'daily';
        const days = [...new Set(repeat)].sort().join(',');
        if (days === 'fri,mon,thu,tue,wed') return 'weekdays';
        if (days === 'sat,sun') return 'weekends';
        if (days === 'fri,mon,sat,sun,thu,tue,wed') return 'daily';
        return 'custom';
    }

    // Same-session Quick Capture draft: never place private text in URLs.
    if (!editingHabit && new URLSearchParams(location.search).get('capture') === '1') {
        try {
            const uid=HabitArc.getAuthUser?.()?.uid || localStorage.getItem('habitarc_active_uid') || 'local';
            const key='habitarc_command_capture:'+uid;
            const draft=JSON.parse(sessionStorage.getItem(key)||'null');
            sessionStorage.removeItem(key);
            if (draft?.owner===uid && Date.now()-draft.savedAt<5*60000) {
                document.getElementById('habit-name-input').value=String(draft.title||'').slice(0,160);
            }
        } catch {}
    }

    if (editingHabit) {
        document.getElementById('habit-form-title').textContent = 'Edit Habit';
        document.getElementById('habit-form-description').textContent = 'Fine-tune the routine you are building.';
        document.getElementById('habit-name-input').value = editingHabit.name || '';
        document.getElementById('reminder-time-input').value = editingHabit.reminder ?? '';
        const repeatSelect = document.getElementById('repeat-select');
        const repeatValue = repeatValueFromDays(editingHabit.repeat);
        if (repeatValue === 'custom') {
            const option = document.createElement('option');
            option.value = 'custom';
            option.textContent = editingHabit.repeat.length
                ? `Keep current schedule (${editingHabit.repeat.join(', ')})`
                : 'Keep current schedule (no days selected)';
            repeatSelect.appendChild(option);
        }
        repeatSelect.value = repeatValue;
        document.getElementById('why-input').value = editingHabit.why || '';
        document.getElementById('motivation-input').value = editingHabit.motivation || '';
        document.getElementById('habit-form-submit').innerHTML = 'Save Changes <span class="material-symbols-outlined text-sm">check</span>';
        setSelectedIcon(editingHabit.icon || selectedIcon);
        setSelectedCategory(editingHabit.category || selectedCategory);
        setSelectedAccentColor(editingHabit.accentColor || '');
    }

    document.getElementById('habit-form-cancel').addEventListener('click', function() {
        window.location.href = editingHabit
            ? `Habit_Detail.html?id=${encodeURIComponent(editingHabit.id)}`
            : 'Habits.html';
    });

    // Form submit
    document.getElementById('add-habit-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('habit-name-input').value.trim();
        if (!name) return;

        const repeatVal = document.getElementById('repeat-select').value;
        let repeatDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        if (repeatVal === 'weekdays') repeatDays = ['mon', 'tue', 'wed', 'thu', 'fri'];
        if (repeatVal === 'weekends') repeatDays = ['sat', 'sun'];
        if (repeatVal === 'custom' && editingHabit) repeatDays = [...editingHabit.repeat];

        const reminder = document.getElementById('reminder-time-input').value;
        const why = document.getElementById('why-input').value.trim();
        const motivation = document.getElementById('motivation-input').value.trim();

        const payload = {
            name,
            icon: selectedIcon,
            category: selectedCategory,
            accentColor: selectedAccentColor || undefined,
            reminder,
            repeat: repeatDays,
            why,
            motivation
        };

        if (editingHabit) {
            const updated = HabitArc.updateHabit(editingHabit.id, payload);
            if (updated) {
                window.location.href = `Habit_Detail.html?id=${encodeURIComponent(editingHabit.id)}`;
            } else {
                alert('We could not update this habit. Please try again.');
            }
            return;
        }

        const result = HabitArc.addHabit(payload);

        if (result.success) {
            window.location.href = 'Habits.html';
        } else {
            alert(result.message);
        }
    });
})();
</script>
</body></html>
